name: Plugin Tests

# 跑仓库里的插件单测（tests/v3）。
#
# 为什么需要它：仓库自带一份最小宿主垫片（tests/stub/），照 MoviePilot v3
# 宿主的公开签名实现插件用到的那些符号，所以**不需要拉起真实后端**就能跑。
# 任何插件改动都应当在这里保持绿色。
#
# 手动触发：Actions 页面 → Plugin Tests → Run workflow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-tests
  cancel-in-progress: true

jobs:
  test:
    name: pytest tests/v3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest pydantic

      - name: Run tests
        run: python -m pytest tests/v3 -q

      - name: Syntax check plugins
        run: |
          for f in plugins.v3/*/__init__.py plugins.v3/*/*.py; do
            python -m py_compile "$f"
          done
          echo "插件源码语法检查通过。"
