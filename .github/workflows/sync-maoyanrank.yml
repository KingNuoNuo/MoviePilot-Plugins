name: Sync MaoyanRank from upstream

# 每天检查上游 jxxghp/moviepilot-plugins 的 plugins.v3/maoyanrank/ 是否有改动。
# 有改动时用三方合并把上游改动套进本仓库的独立发行版，递增 patch 版本并重建打包产物，
# 然后开一个 PR 等人工审核；合并无冲突才会走版本递增，有冲突则只提交带冲突标记的分支。
#
# 为什么不是「直接覆盖」：本仓库的插件已与上游大幅分叉（新增榜单对外接口、榜单快照、
# 推荐页数据源等），直接覆盖会丢掉这些改动，所以必须三方合并。
#
# 合并基线存在 .upstream/maoyanrank/，同步成功后会随 PR 一起推进。
#
# 手动触发：Actions 页面 → Sync MaoyanRank from upstream → Run workflow
#   force 勾选后可跳过「上游无更新」判断，强制执行一次合并。
#
# 说明：用 GITHUB_TOKEN 创建的分支与 PR 不会触发其它工作流（GitHub 的限制），
# 因此合并 PR 后不会自动跑 Traffic Stats，等它下一次定时执行即可。

on:
  schedule:
    - cron: "23 4 * * *" # UTC 04:23
  workflow_dispatch:
    inputs:
      force:
        description: 忽略「上游无更新」判断，强制执行一次合并
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-maoyanrank
  cancel-in-progress: false

env:
  SYNC_BRANCH: auto/sync-maoyanrank

jobs:
  sync:
    name: 检测并合并上游改动
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查是否已有开启中的同步 PR
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq 'length')
          echo "已开启的同步 PR 数量：${count}"
          echo "open=${count}" >> "$GITHUB_OUTPUT"

      - name: 同步上游改动
        id: sync
        if: steps.guard.outputs.open == '0'
        env:
          SYNC_REPORT_PATH: ${{ runner.temp }}/sync-report.md
        run: |
          python scripts/sync_maoyanrank.py ${{ inputs.force && '--force' || '' }}

      - name: 校验合并结果
        if: steps.guard.outputs.open == '0' && steps.sync.outputs.changed == 'true' && steps.sync.outputs.conflict != 'true'
        run: |
          python -m py_compile plugins.v3/maoyanpro/__init__.py
          echo "合并后的插件源码语法检查通过。"
          python -m pip install --quiet pytest pyyaml
          python -m pytest tests/scripts -q

      - name: 写入运行摘要
        if: steps.guard.outputs.open == '0' && steps.sync.outputs.changed == 'true'
        run: |
          if [ -f "${{ runner.temp }}/sync-report.md" ]; then
            cat "${{ runner.temp }}/sync-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 提交到同步分支
        id: commit
        if: steps.guard.outputs.open == '0' && steps.sync.outputs.changed == 'true'
        run: |
          version="${{ steps.sync.outputs.new_version }}"
          upstream="${{ steps.sync.outputs.upstream_version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git add -A
          if git diff --staged --quiet; then
            echo "没有可提交的变化。"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$version" ]; then
            git commit -m "chore(maoyanrank): 同步上游 ${upstream}，独立发行版 v${version}"
          else
            git commit -m "chore(maoyanrank): 同步上游 ${upstream}（存在冲突，待人工解决）"
          fi
          git push --force origin "$SYNC_BRANCH"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: 创建 Pull Request
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.sync.outputs.new_version }}"
          upstream="${{ steps.sync.outputs.upstream_version }}"
          if [ -n "$version" ]; then
            title="chore(maoyanrank): 同步上游 ${upstream}（v${version}）"
          else
            title="chore(maoyanrank): 同步上游 ${upstream}（有冲突，待人工解决）"
          fi
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$SYNC_BRANCH" \
            --title "$title" \
            --body-file "${{ runner.temp }}/sync-report.md"

      - name: 冲突时开 Issue
        if: steps.commit.outputs.committed == 'true' && steps.sync.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --search "上游 MaoyanRank 同步冲突 in:title" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "已有开启中的冲突 Issue，跳过创建。"
            exit 0
          fi
          gh issue create \
            --title "[auto] 上游 MaoyanRank 同步冲突待处理" \
            --body-file "${{ runner.temp }}/sync-report.md"

      - name: 无改动提示
        if: steps.guard.outputs.open == '0' && steps.sync.outputs.changed != 'true'
        run: echo "上游没有新改动，无需处理。"
